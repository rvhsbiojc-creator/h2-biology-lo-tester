<body>

<h2>H2 Biology LO Tester</h2>

<div id="login" class="card">

  <h3>Login</h3>

  <input id="email" placeholder="Enter email">

  <button onclick="login()">
    Enter
  </button>

  <p id="loginMsg"></p>

</div>

<div id="modeSelect"
     class="card"
     style="display:none;">

  <h3>Select Mode</h3>

  <button onclick="selectMode('builder')">
    LO Builder Mode
  </button>

  <br>

  <button onclick="selectMode('self')">
    Self-Review Mode
  </button>

  <br>

  <button onclick="selectMode('remediation')">
    Remediation Mode
  </button>

</div>

<div id="topics"
     class="card"
     style="display:none;">

  <h3>Select Topic</h3>

  <div id="topicList"></div>

</div>

<div id="loChoiceSection"
     class="card"
     style="display:none;">

  <h3>Select LO Question</h3>

  <div id="loChoiceList"></div>

</div>

<div id="loSection"
     class="card"
     style="display:none;">

  <div class="context-box">

    <div class="context-grid">

      <div class="label">
        Topic

       class="lo-question-display"></div>

  <div id="answerArea"></div>

    Submit
  </button>

       style="display:none;"></div>

</div>

<script>

const BASE_URL =
"https://script.google.com/macros/s/AKfycbwr1KNigX2URrSrlaE9oJ9WzBjoGT1glTziLb2l3Yb67hkIvGeVG3TZrkF7pwMbTJdyXg/exec";

let studentEmail = "";

let currentMode = "";

let currentTopicId = "";
let currentTopicName = "";

let currentLOs = [];
let currentLOIndex = 0;

let currentLO = "";
let currentLOPackage = null;

let attemptNo = 1;

let remediationStartedAt = null;

/************************************
 * LOGIN
 ************************************/
async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const res =
    await fetch(
      `${BASE_URL}?action=validateStudent&email=${encodeURIComponent(email)}`
    );

  const data =
    await res.json();

  if(data.valid){

    studentEmail = email;

    document
      .getElementById("login")
      .style.display = "none";

    document
      .getElementById("modeSelect")
      .style.display = "block";

  }else{

    document
      .getElementById("loginMsg")
      .innerText = "Invalid email";
  }
}

/************************************
 * MODE
 ************************************/
function selectMode(mode){

  currentMode = mode;

  document
    .getElementById("modeSelect")
    .style.display = "none";

  loadTopics();
}

/************************************
 * TOPICS
 ************************************/
async function loadTopics(){

  const res =
    await fetch(
      `${BASE_URL}?action=getTopics`
    );

  const data =
    await res.json();

  document
    .getElementById("topics")
    .style.display = "block";

  let html = "";

  data.topics.forEach(t => {

    html += `
      <button onclick="
        loadTopic(
          '${escapeJs(t.Topic_ID)}',
          '${escapeJs(t.Topic_Name)}'
        )
      ">
        ${escapeHtml(t.Topic_Name)}
      </button>
      <br>
    `;
  });

  document
    .getElementById("topicList")
    .innerHTML = html;
}

/************************************
 * LOAD TOPIC
 ************************************/
async function loadTopic(id,name){

  currentTopicId = id;
  currentTopicName = name;

  const res =
    await fetch(
      `${BASE_URL}?action=getTopicLOs&topicId=${encodeURIComponent(id)}`
    );

  const data =
    await res.json();

  currentLOs = data.los || [];

  /***** RANDOMISE REMEDIATION *****/
  if(currentMode === "remediation"){

    shuffleArray(currentLOs);

    remediationStartedAt =
      new Date();

    currentLOIndex = 0;

    document
      .getElementById("topics")
      .style.display = "none";

    loadLO(currentLOIndex);

    return;
  }

  document
    .getElementById("topics")
    .style.display = "none";

  showLOChoice();
}

/************************************
 * LO CHOICE
 ************************************/
function showLOChoice(){

  document
    .getElementById("loChoiceSection")
    .style.display = "block";

  let html = "";

  currentLOs.forEach((lo,i)=>{

    html += `
      <button onclick="loadLO(${i})">

        LO${i+1}:
        ${escapeHtml(lo.LO_Question)}

      </button>

      <br>
    `;
  });

  document
    .getElementById("loChoiceList")
    .innerHTML = html;
}

/************************************
 * LOAD LO
 ************************************/
async function loadLO(i){

  const lo =
    currentLOs[i];

  currentLO = lo.LO_ID;

  attemptNo = 1;

  const pkgRes =
    await fetch(
      `${BASE_URL}?action=getLOPackage&loId=${encodeURIComponent(currentLO)}`
    );

  currentLOPackage =
    await pkgRes.json();

  document
    .getElementById("loChoiceSection")
    .style.display = "none";

  document
    .getElementById("loSection")
    .style.display = "block";

  document
    .getElementById("feedback")
    .style.display = "none";

  document
    .getElementById("currentTopicName")
    .innerText = currentTopicName;

  document
    .getElementById("currentModeName")
    .innerText = getModeDisplayName(currentMode);

  document
    .getElementById("loQuestion")
    .innerText = lo.LO_Question;

  if(currentMode==="remediation"){

    document
      .getElementById("remediationProgress")
      .innerHTML = `
        <div class="section-box">
          LO ${currentLOIndex + 1}
          of
          ${currentLOs.length}
        </div>
      `;
  }else{

    document
      .getElementById("remediationProgress")
      .innerHTML = "";
  }

  renderAnswerArea();

  if(currentMode==="builder"){

    document
      .getElementById("modeInstruction")
      .innerText =
      "Provide your answer to the LO Question. The LO Builder will guide you.";

  }else if(currentMode==="self"){

    document
      .getElementById("modeInstruction")
      .innerText =
      "Provide your answer to check key terms, phrasing and completeness.";

  }else{

    document
      .getElementById("modeInstruction")
      .innerText =
      "Rewrite the full answer until mastery is achieved.";
  }
}

/************************************
 * ANSWER AREA
 ************************************/
function renderAnswerArea(){

  const bullets =
    currentLOPackage.answerBullets || [];

  const prompts =
    bullets.map(() => "• ").join("\n");

  document
    .getElementById("answerArea")
    .innerHTML = `

      <textarea
        id="singleResponse"
        rows="${Math.max(5, bullets.length * 2)}"
        placeholder="Write one point per bullet."
      >${prompts}</textarea>

      <p class="hint">
        Please answer using the bullet points provided. Each bullet should correspond to one expected answer point.
      </p>
    `;
}

/************************************
 * SUBMIT
 ************************************/
async function submitAnswer(){

  const responsePayload =
    document
      .getElementById("singleResponse")
      .value;

  const res =
    await fetch(

      `${BASE_URL}?action=checkResponse`

      + `&email=${encodeURIComponent(studentEmail)}`

      + `&loId=${encodeURIComponent(currentLO)}`

      + `&mode=${encodeURIComponent(currentMode)}`

      + `&attemptNo=${attemptNo}`

      + `&response=${encodeURIComponent(responsePayload)}`
    );

  const data =
    await res.json();

  renderStructuredFeedback(data);

  /***** CORRECT *****/
  if(data.correct){

    /***** REMEDIATION FLOW *****/
    if(currentMode==="remediation"){

      showRemediationCelebration();

      return;
    }

    return;
  }

  attemptNo++;
}
  /************************************
 * REMEDIATION CELEBRATION
 ************************************/
function showRemediationCelebration(){

  const completed =

  const total =
    currentLOs.length;

  const garden =
    getGardenProgress(
      completed,
      total
    );

  let finalMessage = "";

  /***** FINAL LO *****/
  if(completed >= total){

    finalMessage = `

      <div class="section-box">

        <div style="
          font-size:34px;
          text-align:center;
          line-height:1.8;
        ">

          🌞😎🌸🌺🌻🌷🪻🌼🌿

        </div>

        <h2 style="text-align:center;">

          TOPIC COMPLETED!

        </h2>

        <div style="
          text-align:center;
          font-size:18px;
          line-height:1.8;
        ">

          Your Biology garden is now fully blooming!

          <br><br>

          Excellent perseverance —
          your remediation session
          has been successfully completed
          and saved.

        </div>

        <div style="
          font-size:34px;
          text-align:center;
          line-height:1.8;
          margin-top:12px;
        ">

          🌞😎🌸🌺🌻🌷🪻🌼🌿

        </div>

        <div style="
          text-align:center;
          margin-top:18px;
        ">

          <button onclick="finishRemediationTopic()">

            Finish Session

          </button>

        </div>

      </div>
    `;

  }else{

    finalMessage = `

      <div class="section-box">

        <div style="
          text-align:center;
          font-size:30px;
          line-height:1.8;
        ">

          ${garden}

        </div>

        <h2 style="text-align:center;">

          🎉 LO COMPLETED!

        </h2>

        <div style="
          text-align:center;
          line-height:1.8;
        ">

          Well done —
          your Biology garden has grown.

          <br><br>

          You must complete all LOs
          in this topic before
          your remediation attempt
          can be saved.

        </div>

        <div style="
          text-align:center;
          margin-top:18px;
        ">

          <button onclick="continueRemediationLO()">

            Continue to Next LO

          </button>

        </div>

      </div>
    `;
  }

  /***** MODEL ANSWER *****/
  let modelAnswer = `

    <div class="section-box">

      <div class="section-title">

        Model Answer

      </div>
  `;

  currentLOPackage.answerBullets
    .forEach(b=>{

      modelAnswer += `
        • ${escapeHtml(b.Canonical_Answer)}
        <br><br>
      `;
    });

  modelAnswer += `</div>`;

  document
    .getElementById("feedback")
    .innerHTML =

      finalMessage
      +
      modelAnswer;
}

/************************************
 * CONTINUE REMEDIATION
 ************************************/
function continueRemediationLO(){

  currentLOIndex++;

  loadLO(currentLOIndex);
}

/************************************
 * FINISH TOPIC
 ************************************/
async function logTopicCompletion(){

  const completedAt =
    new Date();

  const durationSeconds =
    Math.floor(
      (
        completedAt -
        remediationStartedAt
      ) / 1000
    );

  const durationDisplay =
    formatDuration(durationSeconds);

  const res =
    await fetch(

      `${BASE_URL}?action=logTopicCompletion`

      + `&email=${encodeURIComponent(studentEmail)}`

      + `&topicId=${encodeURIComponent(currentTopicId)}`

      + `&topicName=${encodeURIComponent(currentTopicName)}`

      + `&mode=${encodeURIComponent(currentMode)}`

      + `&startedAt=${encodeURIComponent(remediationStartedAt.toISOString())}`

      + `&completedAt=${encodeURIComponent(completedAt.toISOString())}`

      + `&durationSeconds=${encodeURIComponent(durationSeconds)}`

      + `&durationDisplay=${encodeURIComponent(durationDisplay)}`

      + `&loCount=${currentLOs.length}`
    );

  return await res.json();
}

  function formatDuration(totalSeconds){

  const h =
    Math.floor(totalSeconds / 3600);

  const m =
    Math.floor((totalSeconds % 3600) / 60);

  const s =
    totalSeconds % 60;

  if(h > 0){
    return `${h}h ${m}m ${s}s`;
  }

  return `${m}m ${s}s`;
}

/************************************
 * GARDEN PROGRESSION
 ************************************/
function getGardenProgress(
  completed,
  total
){

  const ratio =
    completed / total;

  if(ratio < 0.34){

    return "🌱";
  }

  if(ratio < 0.67){

    return "🌱🌿🌼";
  }

  if(ratio < 1){

    return "🌿🌸🌼🌷";
  }

  return "🌞😎🌸🌺🌻🌷🪻🌼🌿";
}

/************************************
 * TOPIC COMPLETION
 ************************************/
async function logTopicCompletion(){

  const completedAt =
    new Date();

  const durationSeconds =
    Math.floor(
      (
        completedAt -
        remediationStartedAt
      ) / 1000
    );

  await fetch(

    `${BASE_URL}?action=logTopicCompletion`

    + `&email=${encodeURIComponent(studentEmail)}`

    + `&topicId=${encodeURIComponent(currentTopicId)}`

    + `&topicName=${encodeURIComponent(currentTopicName)}`

    + `&mode=${encodeURIComponent(currentMode)}`

    + `&startedAt=${encodeURIComponent(remediationStartedAt.toISOString())}`

    + `&completedAt=${encodeURIComponent(completedAt.toISOString())}`

    + `&durationSeconds=${durationSeconds}`

    + `&loCount=${currentLOs.length}`
  );
}

/************************************
 * FEEDBACK
 ************************************/
function renderStructuredFeedback(data){

  let bulletFeedback = "";

  data.bulletResults.forEach((b,i)=>{

    const highlighted =
      highlight(
        b.responseText,
        b.highlights || []
      );

    const feedback =
      b.feedbackLabels.length > 0

        ? " — " +

          b.feedbackLabels.map(label=>

            `<span class="feedback-label">
              ${escapeHtml(label)}
            </span>`

          ).join(" ")

        : "";

    bulletFeedback += `

      <div class="student-bullet">

        <strong>
          Bullet ${i+1}
        </strong>

        <br>

        • ${highlighted}${feedback}

      </div>
    `;
  });

  /***** HINTS *****/
  let hints = "";

  if(!data.correct){

    hints += `
      <div class="section-box">

        <div class="section-title">
          Answer Structure Hint
        </div>
    `;

    data.hintOutput.forEach((h,i)=>{

      hints += `

        <div class="hint-line">

          <strong>
            Bullet ${i+1}
          </strong>

          <br><br>

          ${escapeHtml(h.conceptualHint)}

          <div class="green-box">

            ${escapeHtml(h.reconstruction)
              .replace(/\n/g,"<br>")}

          </div>

        </div>

        <hr>
      `;
    });

    /***** REMEDIATION SCAFFOLD *****/
    if(
      currentMode==="remediation"
      &&
      data.remediationScaffold
      &&
      data.remediationScaffold.length > 0
    ){

      hints += `

        <div class="section-box">

          <div class="section-title">
            Scaffold Support
          </div>
      `;

      data.remediationScaffold.forEach((s,i)=>{

        hints += `

          <div>

            <strong>
              Bullet ${i+1}
            </strong>

            <div class="green-box">
              ${escapeHtml(s.scaffold)}
            </div>

          </div>

          <br>
        `;
      });

      hints += `</div>`;
    }

    hints += `</div>`;
  }

  /***** COMMON QUESTIONS *****/
  let commonQuestions = "";

  if(
    data.correct
    &&
    data.commonQuestions
    &&
    data.commonQuestions.length > 0
  ){

    commonQuestions += `

      <div class="section-box">

        <div class="section-title">
          Additional common questions
        </div>
    `;

    data.commonQuestions.forEach(q=>{

      commonQuestions += `
        • ${escapeHtml(q.Common_Question)}
        <br>
      `;
    });

    commonQuestions += `</div>`;
  }

  document
    .getElementById("feedback")
    .style.display = "block";

  document
    .getElementById("feedback")
    .innerHTML = `

      <div class="section-box">

        <div class="section-title">
          Feedback on your submission
        </div>

        ${bulletFeedback}

      </div>

      ${hints}

      <div class="section-box">

        <div class="section-title">
          Next step
        </div>

        ${
          data.correct

            ? "Correct."

            : escapeHtml(data.message)
        }

      </div>

      ${commonQuestions}
  `;
}

/************************************
 * HELPERS
 ************************************/
function highlight(text,arr){

  let out =
    escapeHtml(text);

  arr.forEach(h=>{

    const r =
      new RegExp(
        escapeRegExp(h),
        "gi"
      );

    out =
      out.replace(
        r,
        match=>
          `<span class="wrong">
            ${match}
          </span>`
      );
  });

  return out;
}

function shuffleArray(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [array[i],array[j]]
      =
    [array[j],array[i]];
  }
}

function getModeDisplayName(mode){

  if(mode==="builder"){
    return "LO Builder Mode";
  }

  if(mode==="self"){
    return "Self-Review Mode";
  }

  if(mode==="remediation"){
    return "Remediation Mode";
  }

  return mode;
}

function escapeHtml(text){

  return String(text || "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeRegExp(text){

  return String(text || "")

    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );
}

function escapeJs(text){

  return String(text || "")

    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
/************************************
 * FORMAT DURATION
 ************************************/
function formatDuration(totalSeconds){

  const h =
    Math.floor(totalSeconds / 3600);

  const m =
    Math.floor((totalSeconds % 3600) / 60);

  const s =
    totalSeconds % 60;

  if(h > 0){
    return `${h}h ${m}m ${s}s`;
  }

  return `${m}m ${s}s`;
}

/************************************
 * FINAL CELEBRATION
 ************************************/
function renderFinalLeaderboardCelebration(result){

  const rows =
    result.leaderboard || [];

  const firstCompletionMessage =
    result.firstCompletion
      ? "🌟 Your first completion has been entered into the leaderboard!"
      : "You have completed this topic before, so this attempt was saved but not ranked again.";

  let leaderboardRows = "";

  rows.forEach(r => {

    let medal = "🌟";

    if(r.rank === 1) medal = "🥇";
    if(r.rank === 2) medal = "🥈";
    if(r.rank === 3) medal = "🥉";

    leaderboardRows += `

      <tr>

        <td>
          ${medal} ${r.rank}
        </td>

        <td>
          ${escapeHtml(r.name)}
        </td>

        <td>
          ${escapeHtml(r.className)}
        </td>

        <td>
          ${escapeHtml(r.time)}
        </td>

      </tr>
    `;
  });

  document.body.innerHTML = `

    <div style="
      min-height:100vh;
      width:100%;
      background:linear-gradient(180deg,#fffbea,#eaffea,#f5f0ff);
      font-family:Arial,sans-serif;
      padding:28px;
      box-sizing:border-box;
    ">

      <div style="
        max-width:1100px;
        margin:0 auto;
        background:white;
        border-radius:24px;
        padding:32px;
        box-shadow:0 8px 28px rgba(0,0,0,0.12);
        border:1px solid #e8e8e8;
      ">

        <div style="
          text-align:center;
          font-size:42px;
          line-height:1.7;
        ">

          🎆✨🌞😎🌸🌺🌻🌷🪻🌼🌿✨🎆

        </div>

        <h1 style="
          text-align:center;
          font-size:42px;
          margin:18px 0 8px 0;
        ">

          TOPIC COMPLETED!

        </h1>

        <div style="
          text-align:center;
          font-size:22px;
          line-height:1.8;
          margin-bottom:24px;
        ">

          Your Biology garden is fully blooming!

          <br>

          ${escapeHtml(firstCompletionMessage)}

        </div>

        <div style="
          text-align:center;
          font-size:34px;
          margin:24px 0;
        ">

          🏆 Top 10 Fastest First Completions 🏆

        </div>

        <div style="
          width:100%;
          overflow-x:auto;
        ">

          <table style="
            width:100%;
            border-collapse:collapse;
            font-size:18px;
            background:#ffffff;
          ">

            <thead>

              <tr style="background:#fff3b0;">

                <th style="padding:14px;border:1px solid #ddd;text-align:center;">
                  Rank
                </th>

                <th style="padding:14px;border:1px solid #ddd;text-align:left;">
                  Student
                </th>

                <th style="padding:14px;border:1px solid #ddd;text-align:center;">
                  Class
                </th>

                <th style="padding:14px;border:1px solid #ddd;text-align:center;">
                  Time
                </th>

              </tr>

            </thead>

            <tbody>

              ${leaderboardRows || `
                <tr>
                  <td colspan="4" style="padding:18px;text-align:center;border:1px solid #ddd;">
                    No leaderboard entries yet.
                  </td>
                </tr>
              `}

            </tbody>

          </table>

        </div>

        <div style="
          text-align:center;
          font-size:38px;
          line-height:1.8;
          margin-top:28px;
        ">

          🌞😎🌸🌺🌻🌷🪻🌼🌿🎉🎆

        </div>

        <div style="
          text-align:center;
          margin-top:28px;
        ">

          <button onclick="location.reload()" style="
            font-size:18px;
            padding:14px 24px;
            border-radius:14px;
            border:1px solid #aaa;
            background:#ffffff;
            cursor:pointer;
          ">

            Return to Home

          </button>

        </div>

      </div>

    </div>
  `;
}

  async function finishRemediationTopic(){

  const result =
    await logTopicCompletion();

  renderFinalLeaderboardCelebration(result);
}
</script>
