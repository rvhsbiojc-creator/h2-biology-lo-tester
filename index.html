<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H2 Biology LO Tester</title>

  <style>
    *{box-sizing:border-box;}

    body{
      font-family:Arial,sans-serif;
      padding:24px;
      max-width:1000px;
      margin:auto;
      background:#fafafa;
    }

    .card{
      background:white;
      border:1px solid #ddd;
      border-radius:12px;
      padding:20px;
      margin-top:16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .section-box{
      border:1px solid #ddd;
      border-radius:10px;
      padding:14px;
      margin-top:14px;
      background:#fcfcfc;
    }

    .section-title{
      font-weight:bold;
      margin-bottom:8px;
    }

    .green-box{
      background:#eaf8ea;
      border:1px solid #c8e6c9;
      border-radius:8px;
      padding:12px;
      margin-top:10px;
      line-height:1.6;
    }

    button{
      margin-top:10px;
      padding:9px 14px;
      border-radius:8px;
      border:1px solid #aaa;
      cursor:pointer;
      background:white;
      min-height:44px;
      font-size:15px;
    }

    textarea{
      width:100%;
      max-width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid #bbb;
      font-size:16px;
      margin-top:6px;
      line-height:1.5;
    }

    input,select{
      padding:8px;
      border-radius:8px;
      border:1px solid #bbb;
      width:100%;
      max-width:100%;
      font-size:16px;
    }

    .wrong{
      text-decoration:line-through;
      text-decoration-thickness:2px;
      color:#b00020;
      font-weight:bold;
    }

    .feedback-label{
      background:#fff3a6;
      padding:2px 6px;
      border-radius:6px;
      display:inline-block;
      margin:2px 2px;
    }

    .correct-label{
      background:#d8f5d1;
      color:#1b6b22;
      padding:2px 6px;
      border-radius:6px;
      display:inline-block;
      margin:2px 2px;
    }

    .spelling-label{
      background:#ffd6d6;
      color:#8b0000;
      padding:2px 6px;
      border-radius:6px;
      display:inline-block;
      margin:2px 2px;
    }

    .context-box{
      background:#f7f7f7;
      border-radius:10px;
      padding:12px;
      margin-bottom:14px;
      border:1px solid #e0e0e0;
    }

    .context-grid{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:8px 14px;
    }

    .label{font-weight:bold;}

    .lo-question-display{
      font-size:20px;
      font-weight:bold;
      line-height:1.4;
      margin:10px 0 8px 0;
    }

    .student-bullet{
      margin:10px 0;
      line-height:1.5;
    }

    .hint{color:#666;font-size:14px;line-height:1.5;}

    table{
      width:100%;
      border-collapse:collapse;
    }

    @media (max-width:768px){
      body{padding:12px;max-width:100%;}
      h1,h2{font-size:24px;}
      .card{padding:14px;border-radius:10px;}
      .section-title{font-size:18px;}
      .context-grid{grid-template-columns:1fr;gap:4px;}
      button{width:100%;text-align:center;margin-top:10px;}
      .lo-question-display{font-size:18px;}
      .student-bullet,.hint-line,.green-box{font-size:15px;}
      table{font-size:14px;}
    }

    @media (max-width:480px){
      body{padding:8px;}
      h1,h2{font-size:22px;}
      .card{padding:12px;}
      textarea{min-height:120px;}
      .lo-question-display{font-size:17px;}
      .green-box{padding:8px;}
    }
  </style>
</head>

<body>

<h2>H2 Biology LO Tester</h2>

<div id="login" class="card">
  <h3>Login</h3>
  <input id="email" placeholder="Enter email">
  <button onclick="login()">Enter</button>
  <p id="loginMsg"></p>
</div>

<div id="modeSelect" class="card" style="display:none;">
  <h3>Select Mode</h3>
  <button onclick="selectMode('builder')">LO Builder Mode</button><br>
  <button onclick="selectMode('self')">Self-Review Mode</button><br>
  <button onclick="selectMode('remediation')">Remediation Mode</button>
</div>

<div id="topics" class="card" style="display:none;">
  <h3>Select Topic</h3>
  <div id="topicList"></div>
</div>

<div id="loChoiceSection" class="card" style="display:none;">
  <h3>Select LO Question</h3>
  <div id="loChoiceList"></div>
</div>

<div id="loSection" class="card" style="display:none;">
  <div class="context-box">
    <div class="context-grid">
      <div class="label">Topic</div>
      <div id="currentTopicName"></div>
      <div class="label">Mode</div>
      <div id="currentModeName"></div>
    </div>
  </div>

  <div id="remediationProgress"></div>

  <h3>LO Question</h3>
  <div id="loQuestion" class="lo-question-display"></div>
  <p id="modeInstruction"></p>
  <div id="scaffoldArea"></div>
  <div id="answerArea"></div>
  
<button id="submitBtn" onclick="submitAnswer()">
  Submit
</button>
  <div id="feedback" style="display:none;"></div>
</div>
  
<script>
const BASE_URL =
"https://script.google.com/macros/s/AKfycbwr1KNigX2URrSrlaE9oJ9WzBjoGT1glTziLb2l3Yb67hkIvGeVG3TZrkF7pwMbTJdyXg/exec";

let studentEmail = "";
let currentMode = "";
let currentTopicId = "";
let currentTopicName = "";
let currentLOs = [];
let currentLOIndex = 0;
let currentLO = "";
let currentLOPackage = null;
let attemptNo = 1;
let remediationStartedAt = null;

/************************************
 * LOGIN
 ************************************/
async function login(){
  const email = document.getElementById("email").value.trim();

  try{
    const res = await fetch(
      `${BASE_URL}?action=validateStudent&email=${encodeURIComponent(email)}`
    );

    const data = await res.json();

    if(data.valid){
      studentEmail = email;
      document.getElementById("login").style.display = "none";
      document.getElementById("modeSelect").style.display = "block";
    }else{
      document.getElementById("loginMsg").innerText = "Invalid email";
    }
  }catch(err){
    document.getElementById("loginMsg").innerText = "Unable to connect to backend.";
    console.error(err);
  }
}

/************************************
 * MODE
 ************************************/
function selectMode(mode){
  currentMode = mode;
  document.getElementById("modeSelect").style.display = "none";
  loadTopics();
}

/************************************
 * TOPICS
 ************************************/
async function loadTopics(){
  const res = await fetch(`${BASE_URL}?action=getTopics`);
  const data = await res.json();

  document.getElementById("topics").style.display = "block";

  let html = "";

  (data.topics || []).forEach(t => {
    const topicLabel = t.Topic_Order ? `Topic ${t.Topic_Order}: ${t.Topic_Name}` : t.Topic_Name;

    html += `
      <button onclick="loadTopic('${escapeJs(t.Topic_ID)}','${escapeJs(t.Topic_Name)}')">
        ${escapeHtml(topicLabel)}
      </button>
      <br>
    `;
  });

  document.getElementById("topicList").innerHTML = html;
}

/************************************
 * LOAD TOPIC
 ************************************/
async function loadTopic(id,name){
  currentTopicId = id;
  currentTopicName = name;

  const res = await fetch(
    `${BASE_URL}?action=getTopicLOs&topicId=${encodeURIComponent(id)}`
  );

  const data = await res.json();
  currentLOs = data.los || [];

  document.getElementById("topics").style.display = "none";

  if(currentMode === "remediation"){
    shuffleArray(currentLOs);
    remediationStartedAt = new Date();
    currentLOIndex = 0;
    loadLO(currentLOIndex);
    return;
  }

  showLOChoice();
}

/************************************
 * LO CHOICE
 ************************************/
function showLOChoice(){
  document.getElementById("loChoiceSection").style.display = "block";

  let html = "";

  currentLOs.forEach((lo,i)=>{
    html += `
      <button onclick="loadLO(${i})">
        LO${i+1}: ${escapeHtml(lo.LO_Question)}
      </button>
      <br>
    `;
  });

  document.getElementById("loChoiceList").innerHTML = html;
}

/************************************
 * LOAD LO
 ************************************/
async function loadLO(i){
  const lo = currentLOs[i];

  if(!lo){
    alert("No LO found.");
    return;
  }

  currentLO = lo.LO_ID;
  attemptNo = 1;

  const pkgRes = await fetch(
    `${BASE_URL}?action=getLOPackage&loId=${encodeURIComponent(currentLO)}`
  );

  currentLOPackage = await pkgRes.json();

  document.getElementById("loChoiceSection").style.display = "none";
  document.getElementById("loSection").style.display = "block";
  document.getElementById("feedback").style.display = "none";
  document.getElementById("feedback").innerHTML = "";

  document.getElementById("currentTopicName").innerText = currentTopicName;
  document.getElementById("currentModeName").innerText = getModeDisplayName(currentMode);
  document.getElementById("loQuestion").innerText = lo.LO_Question;

  if(currentMode === "remediation"){
    document.getElementById("remediationProgress").innerHTML = `
      <div class="section-box">
        LO ${currentLOIndex + 1} of ${currentLOs.length}
      </div>
    `;
  }else{
    document.getElementById("remediationProgress").innerHTML = "";
  }

  renderAnswerArea();

  if(currentMode === "builder"){
    document.getElementById("modeInstruction").innerText =
      "Use the bullet points to build your answer. The LO Builder will guide your thinking.";
  }else if(currentMode === "self"){
    document.getElementById("modeInstruction").innerText =
      "Retrieve and organise your answer independently using the bullet points.";
  }else{
    document.getElementById("modeInstruction").innerText =
      "Rewrite the full answer until mastery is achieved.";
  }
}

/************************************
 * ANSWER AREA
 ************************************/
function renderAnswerArea(){
  const bullets = currentLOPackage.answerBullets || [];
  const prompts = bullets.map(() => "• ").join("\n");

  document.getElementById("answerArea").innerHTML = `
    <textarea
      id="singleResponse"
      rows="${Math.max(5, bullets.length * 2)}"
      placeholder="Write one point per bullet."
    >${prompts}</textarea>

    <p class="hint">
      Please answer using the bullet points provided. Each bullet should correspond to one expected answer point.
    </p>
  `;
}

/************************************
 * SUBMIT
 ************************************/
async function submitAnswer(){

  const submitBtn =
    document.getElementById("submitBtn");

  submitBtn.disabled = true;
  submitBtn.innerText = "Checking...";

  try{

    const responsePayload =
      document
        .getElementById("singleResponse")
        .value;

    const res =
      await fetch(

        `${BASE_URL}?action=checkResponse`

        + `&email=${encodeURIComponent(studentEmail)}`

        + `&loId=${encodeURIComponent(currentLO)}`

        + `&mode=${encodeURIComponent(currentMode)}`

        + `&attemptNo=${attemptNo}`

        + `&response=${encodeURIComponent(responsePayload)}`
      );

    const data =
      await res.json();

    renderStructuredFeedback(data);

    if(data.correct){

      if(currentMode === "remediation"){

        showRemediationCelebration();

        return;
      }

      return;
    }

    attemptNo++;

  }catch(err){

    console.error(err);

    alert(
      "The system took too long or encountered an error. Please try again once."
    );

  }finally{

    submitBtn.disabled = false;
    submitBtn.innerText = "Submit";
  }
}

/************************************
 * FEEDBACK
 ************************************/
function renderStructuredFeedback(data){
  let bulletFeedback = "";

  if(data.bulletResults && data.bulletResults.length){
    data.bulletResults.forEach((b,i)=>{
      const highlighted = highlight(b.responseText || "(blank)", b.highlights || []);

      let feedback = "";

      if(b.correct){
        feedback = ` — <span class="correct-label">correct</span>`;
      }else if(b.feedbackLabels && b.feedbackLabels.length > 0){
        feedback =
          " — " +
          b.feedbackLabels.map(label=>{
            const lower = String(label).toLowerCase();

            if(lower.includes("spelling")){
              return `<span class="spelling-label">${escapeHtml(label)}</span>`;
            }

            return `<span class="feedback-label">${escapeHtml(label)}</span>`;
          }).join(" ");
      }

      bulletFeedback += `
        <div class="student-bullet">
          <strong>Bullet ${i+1}</strong><br>
          • ${highlighted}${feedback}
        </div>
      `;
    });
  }else if(data.mode === "builder"){
    const labels = (data.issueTypes || []).map(label =>
      `<span class="feedback-label">${escapeHtml(label)}</span>`
    ).join(" ");

    const missing = (data.missing || []).map(m => `• ${escapeHtml(m)}<br>`).join("");
    const wrong = (data.highlights || []).map(h => `• <span class="wrong">${escapeHtml(h)}</span><br>`).join("");

    bulletFeedback = `
      <div class="student-bullet">
        ${labels || "No specific issue labels returned."}
        <br><br>
        ${missing ? `<strong>Missing:</strong><br>${missing}<br>` : ""}
        ${wrong ? `<strong>Incorrect:</strong><br>${wrong}` : ""}
      </div>
    `;
  }

  let answerStructureHint = "";

  if(!data.correct && data.hintOutput && data.hintOutput.length > 0){
    answerStructureHint += `
      <div class="section-box">
        <div class="section-title">Answer Structure Hint</div>
    `;

    data.hintOutput.forEach((h,i)=>{
      answerStructureHint += `
        <div class="hint-line">
          <strong>Bullet ${i+1}</strong><br><br>
          ${escapeHtml(h.conceptualHint || "")}
          ${
            currentMode === "self" || currentMode === "builder"
              ? `<div class="green-box">${escapeHtml(h.reconstruction || "").replace(/\n/g,"<br>")}</div>`
              : ""
          }
        </div>
        <hr>
      `;
    });

    answerStructureHint += `</div>`;
  }

  let builderModelAnswer = "";

  if(currentMode === "builder" && data.builderOutput && data.builderOutput.length > 0){
    builderModelAnswer += `
      <div class="section-box">
        <div class="section-title">✨ Model Answer Suggestion ✨</div>
    `;

    data.builderOutput.forEach(b=>{
      builderModelAnswer += `• ${escapeHtml(b.text)}<br><br>`;
    });

    builderModelAnswer += `</div>`;
  }

  let commonQuestions = "";

  if(data.correct && data.commonQuestions && data.commonQuestions.length > 0){
    commonQuestions += `
      <div class="section-box">
        <div class="section-title">Additional common questions</div>
    `;

    data.commonQuestions.forEach(q=>{
      commonQuestions += `• ${escapeHtml(q.Common_Question)}<br>`;
    });

    commonQuestions += `</div>`;
  }

  document.getElementById("feedback").style.display = "block";
  document.getElementById("feedback").innerHTML = `
    <div class="section-box">
      <div class="section-title">Feedback on your submission</div>
      ${bulletFeedback}
    </div>

    ${answerStructureHint}
    ${builderModelAnswer}

    <div class="section-box">
      <div class="section-title">Next Step</div>
      ${data.correct ? "Correct." : escapeHtml(data.message || "Using the feedback provided, rewrite your full answer and submit again.")}
    </div>

    ${commonQuestions}
  `;
}

/************************************
 * REMEDIATION CELEBRATION
 ************************************/
function showRemediationCelebration(){
  const completed = currentLOIndex + 1;
  const total = currentLOs.length;
  const garden = getGardenProgress(completed,total);

  let finalMessage = "";

  if(completed >= total){
    finalMessage = `
      <div class="section-box">
        <div style="font-size:30px;text-align:center;line-height:1.8;">
          🌞😎🌸🌺🌻🌷🪻🌼🌿
        </div>

        <h2 style="text-align:center;">TOPIC COMPLETED!</h2>

        <div style="text-align:center;font-size:18px;line-height:1.8;">
          Your Biology garden is now fully blooming!<br><br>
          Excellent perseverance — your remediation session has been successfully completed and saved.
        </div>

        <div style="font-size:30px;text-align:center;line-height:1.8;margin-top:12px;">
          🌞😎🌸🌺🌻🌷🪻🌼🌿
        </div>

        <div style="text-align:center;margin-top:18px;">
          <button onclick="finishRemediationTopic()">Finish Session</button>
        </div>
      </div>
    `;
  }else{
    finalMessage = `
      <div class="section-box">
        <div style="text-align:center;font-size:30px;line-height:1.8;">${garden}</div>

        <h2 style="text-align:center;">🎉 LO COMPLETED!</h2>

        <div style="text-align:center;line-height:1.8;">
          Well done — your Biology garden has grown.<br><br>
          You must complete all LOs in this topic before your remediation attempt can be saved.
        </div>

        <div style="text-align:center;margin-top:18px;">
          <button onclick="continueRemediationLO()">Continue to Next LO</button>
        </div>
      </div>
    `;
  }

  let modelAnswer = `
    <div class="section-box">
      <div class="section-title">✨ Model Answer ✨</div>
  `;

  (currentLOPackage.answerBullets || []).forEach(b=>{
    modelAnswer += `• ${escapeHtml(b.Canonical_Answer)}<br><br>`;
  });

  modelAnswer += `</div>`;

  let commonQuestions = "";

  if(currentLOPackage.commonQuestions && currentLOPackage.commonQuestions.length > 0){
    commonQuestions += `
      <div class="section-box">
        <div class="section-title">Additional common questions</div>
    `;

    currentLOPackage.commonQuestions.forEach(q=>{
      commonQuestions += `• ${escapeHtml(q.Common_Question)}<br>`;
    });

    commonQuestions += `</div>`;
  }

  document.getElementById("feedback").style.display = "block";
  document.getElementById("feedback").innerHTML =
    finalMessage + modelAnswer + commonQuestions;
}

/************************************
 * CONTINUE REMEDIATION
 ************************************/
function continueRemediationLO(){
  currentLOIndex++;
  loadLO(currentLOIndex);
}

/************************************
 * FINISH REMEDIATION TOPIC
 ************************************/
async function finishRemediationTopic(){
  try{
    const result = await logTopicCompletion();
    renderFinalLeaderboardCelebration(result);
  }catch(err){
    console.error(err);
    alert("Unable to load leaderboard celebration.");
  }
}

/************************************
 * LOG TOPIC COMPLETION
 ************************************/
async function logTopicCompletion(){
  const completedAt = new Date();

  const durationSeconds = Math.floor((completedAt - remediationStartedAt) / 1000);
  const durationDisplay = formatDuration(durationSeconds);

  const res = await fetch(
    `${BASE_URL}?action=logTopicCompletion`
    + `&email=${encodeURIComponent(studentEmail)}`
    + `&topicId=${encodeURIComponent(currentTopicId)}`
    + `&topicName=${encodeURIComponent(currentTopicName)}`
    + `&mode=${encodeURIComponent(currentMode)}`
    + `&startedAt=${encodeURIComponent(remediationStartedAt.toISOString())}`
    + `&completedAt=${encodeURIComponent(completedAt.toISOString())}`
    + `&durationSeconds=${encodeURIComponent(durationSeconds)}`
    + `&durationDisplay=${encodeURIComponent(durationDisplay)}`
    + `&loCount=${currentLOs.length}`
  );

  return await res.json();
}

/************************************
 * FINAL LEADERBOARD CELEBRATION
 ************************************/
function renderFinalLeaderboardCelebration(result){
  const rows = result.leaderboard || [];

  const firstCompletionMessage =
    result.firstCompletion
      ? "🌟 Your first completion has been entered into the leaderboard!"
      : "🌿 This topic was already completed previously, so this attempt was saved but not ranked again.";

  let leaderboardRows = "";

  rows.forEach(r => {
    let medal = "🌸";
    if(r.rank === 1) medal = "🥇";
    if(r.rank === 2) medal = "🥈";
    if(r.rank === 3) medal = "🥉";

    leaderboardRows += `
      <tr>
        <td>${medal} ${r.rank}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.className)}</td>
        <td>${escapeHtml(r.time)}</td>
      </tr>
    `;
  });

  document.documentElement.style.margin = "0";
  document.documentElement.style.padding = "0";
  document.documentElement.style.width = "100%";
  document.documentElement.style.maxWidth = "none";

  document.body.style.margin = "0";
  document.body.style.padding = "0";
  document.body.style.maxWidth = "none";
  document.body.style.width = "100%";
  document.body.style.background = "transparent";

  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      width:100%;
      background:linear-gradient(180deg,#fff8d6 0%,#eaffea 45%,#f7efff 100%);
      padding:22px;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    ">
      <div style="width:100%;">
        <div style="text-align:center;font-size:clamp(22px,4vw,34px);line-height:1.7;">
          🎆✨🌞🌸🌺🌻🌷🪻🌼🌿✨🎉✨🌈💐🎊🌸🌼🌿✨🎆
        </div>

        <h1 style="text-align:center;font-size:clamp(26px,4vw,36px);margin:16px 0 8px 0;">
          TOPIC COMPLETED!
        </h1>

        <div style="text-align:center;font-size:clamp(16px,2.2vw,20px);line-height:1.7;margin-bottom:22px;">
          🌿 Your Biology garden is now fully blooming! 🌿<br><br>
          ${escapeHtml(firstCompletionMessage)}
        </div>

        <h2 style="text-align:center;font-size:clamp(20px,3vw,28px);margin:18px 0;">
          🏆 TOP 10 FASTEST FIRST COMPLETIONS 🏆
        </h2>

        <div style="width:100%;overflow-x:auto;">
          <table style="
            width:100%;
            min-width:720px;
            border-collapse:collapse;
            background:white;
            box-shadow:0 6px 22px rgba(0,0,0,0.10);
            table-layout:fixed;
            font-size:clamp(14px,1.6vw,16px);
          ">
            <thead>
              <tr style="background:#ffe78f;">
                <th style="width:15%;padding:12px;border:1px solid #ddd;">Rank</th>
                <th style="width:45%;padding:12px;border:1px solid #ddd;text-align:left;">Student</th>
                <th style="width:20%;padding:12px;border:1px solid #ddd;">Class</th>
                <th style="width:20%;padding:12px;border:1px solid #ddd;">Time</th>
              </tr>
            </thead>
            <tbody>
              ${leaderboardRows || `
                <tr>
                  <td colspan="4" style="padding:18px;border:1px solid #ddd;text-align:center;">
                    No leaderboard entries yet.
                  </td>
                </tr>
              `}
            </tbody>
          </table>
        </div>

        <div style="text-align:center;font-size:clamp(22px,4vw,34px);margin-top:26px;line-height:1.7;">
          🌞🌸🌺🌻🌷🪻🌼🌿🎉🎆✨🌈💐🎊🌸🌼🌿✨
        </div>

        <div style="text-align:center;margin-top:22px;">
          <button onclick="location.reload()" style="
            font-size:16px;
            padding:12px 22px;
            border-radius:12px;
            border:none;
            background:#ffffff;
            cursor:pointer;
            box-shadow:0 4px 14px rgba(0,0,0,0.10);
          ">
            Return to Home
          </button>
        </div>
      </div>
    </div>
  `;
}

/************************************
 * HELPERS
 ************************************/
function highlight(text,arr){

  let out =
    escapeHtml(text);

  arr.forEach(h=>{

    /************************************
     * WHOLE-WORD MATCH ONLY
     ************************************/
    const escaped =
      escapeRegExp(h);

    const r =
      new RegExp(
        `\\b${escaped}\\b`,
        "gi"
      );

    out =
      out.replace(
        r,
        match =>
          `<span class="wrong">
            ${match}
          </span>`
      );
  });

  return out;
}

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [array[i],array[j]] = [array[j],array[i]];
  }
}

function getModeDisplayName(mode){
  if(mode === "builder") return "LO Builder Mode";
  if(mode === "self") return "Self-Review Mode";
  if(mode === "remediation") return "Remediation Mode";
  return mode;
}

function getGardenProgress(completed,total){
  const ratio = completed / total;
  if(ratio < 0.34) return "🌱";
  if(ratio < 0.67) return "🌱🌿🌼";
  if(ratio < 1) return "🌿🌸🌼🌷";
  return "🌞😎🌸🌺🌻🌷🪻🌼🌿";
}

function formatDuration(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if(h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function escapeHtml(text){
  return String(text || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeRegExp(text){
  return String(text || "")
    .replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function escapeJs(text){
  return String(text || "")
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
