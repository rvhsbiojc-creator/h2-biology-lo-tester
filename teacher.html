<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher LO Builder</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      padding:24px;
      max-width:1200px;
      margin:auto;
      background:#fafafa;
    }

    .card{
      background:white;
      border:1px solid #ddd;
      border-radius:12px;
      padding:20px;
      margin-top:16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    label{
      font-weight:bold;
      display:block;
      margin-top:12px;
    }

    input,textarea,select{
      width:100%;
      padding:8px;
      margin-top:4px;
      border-radius:8px;
      border:1px solid #bbb;
      font-size:16px;
    }

    textarea{
      min-height:90px;
      line-height:1.5;
    }

    button{
      margin-top:12px;
      padding:10px 16px;
      border-radius:8px;
      border:1px solid #aaa;
      background:white;
      cursor:pointer;
      min-height:44px;
    }

    button:hover{
      background:#f0f0f0;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      display:block;
      overflow-x:auto;
      white-space:nowrap;
    }

    th,td{
      border:1px solid #ddd;
      padding:8px;
      vertical-align:top;
    }

    th{
      background:#f5f5f5;
    }

    .bullet-col{
      width:70px;
      min-width:70px;
      text-align:center;
    }

    .section-title{
      font-size:20px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .hint{
      color:#666;
      font-size:14px;
      line-height:1.5;
    }

    .success{
      background:#eaf8ea;
      border:1px solid #9ccc9c;
      color:#256029;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
    }

    .error{
      background:#ffeaea;
      border:1px solid #ffb3b3;
      color:#a40000;
      padding:12px;
      border-radius:8px;
      margin-top:12px;
    }

    .green-box{
      background:#e7f8e7;
      padding:10px;
      border-radius:8px;
      margin-top:8px;
      line-height:1.7;
    }

    .small-button{
      margin:4px;
      padding:6px 10px;
      font-size:13px;
    }

    .selected-row{
      background:#eef8ff;
    }

    @media (max-width:768px){
      body{
        padding:12px;
      }

      .card{
        padding:14px;
      }

      h1{
        font-size:24px;
      }
    }
  </style>
</head>

<body>

<h1>Teacher LO Builder</h1>

<div id="status"></div>

<div class="card">

  <div class="section-title">
    Topic
  </div>

  <label>Select Topic</label>

  <select id="topicSelect"
          onchange="updateTopicFields()">

    <option value="T04|Proteins|PRO">
      Proteins
    </option>

  </select>

  <input id="topicId"
         value="T04"
         hidden>

  <input id="topicCode"
         value="PRO"
         hidden>

</div>

<div class="card">

  <div class="section-title">
    Existing LOs for Topic
  </div>

  <div id="existingLOsBox">
    Loading...
  </div>

</div>

<div class="card">

  <div class="section-title">
    LO Information
  </div>

  <div class="green-box" id="editingLabel">
    Creating NEW LO
  </div>

  <label>LO Number</label>

  <input id="loNumber"
         placeholder="e.g. 4">

  <label>LO Question</label>

  <textarea id="loQuestion"></textarea>

</div>

<div class="card">

  <div class="section-title">
    Answer Bullets
  </div>

  <textarea id="answerBullets"></textarea>

  <label>Hints</label>

  <textarea id="hints"></textarea>

</div>

<div class="card">

  <div class="section-title">
    Keywords, Accepted Variants & Unacceptable Answers
  </div>

  <table id="keywordTable">

    <thead>
      <tr>
        <th class="bullet-col">Bullet</th>
        <th>Keyword / Phrase</th>
        <th>Accepted Variants</th>
        <th>Unacceptable Answers</th>
      </tr>
    </thead>

    <tbody id="keywordBody"></tbody>

  </table>

  <button onclick="addKeywordRow()">
    + Add keyword row
  </button>

</div>

<div class="card">

  <div class="section-title">
    Blank Templates
  </div>

  <textarea id="blankTemplates"></textarea>

</div>

<div class="card">

  <div class="section-title">
    Common Questions
  </div>

  <textarea id="commonQuestions"></textarea>

</div>

<div class="card">

  <button onclick="previewRows()">
    Preview Sheet Rows
  </button>

  <button onclick="saveNewLO()">
    Save New LO
  </button>

  <button onclick="updateExistingLO()">
    Update Existing LO
  </button>

  <button onclick="resetForm()">
    Reset Form
  </button>

</div>

<div id="output"
     style="display:none;">

  <div class="card">

    <div class="section-title">
      Preview Payload
    </div>

    <pre id="previewPayload"></pre>

  </div>

</div>

<script>

const BASE_URL =
"https://script.google.com/macros/s/AKfycbwr1KNigX2URrSrlaE9oJ9WzBjoGT1glTziLb2l3Yb67hkIvGeVG3TZrkF7pwMbTJdyXg/exec";

let existingLOs = [];
let currentEditingLO = null;

/************************************
 * INIT
 ************************************/
window.addEventListener("load", () => {

  updateTopicFields();
});

/************************************
 * TOPIC
 ************************************/
function updateTopicFields(){

  const selected =
    document
      .getElementById("topicSelect")
      .value;

  const parts =
    selected.split("|");

  document
    .getElementById("topicId")
    .value = parts[0];

  document
    .getElementById("topicCode")
    .value = parts[2];

  loadExistingLOs();
}

/************************************
 * LOAD EXISTING LOS
 ************************************/
async function loadExistingLOs(){

  const topicId =
    val("topicId");

  const res =
    await fetch(
      `${BASE_URL}?action=getTopicLOs&topicId=${encodeURIComponent(topicId)}`
    );

  const data =
    await res.json();

  existingLOs =
    data.los || [];

  renderExistingLOs();
}

function renderExistingLOs(){

  const box =
    document.getElementById("existingLOsBox");

  if(existingLOs.length===0){

    box.innerHTML =
      `<p>No LOs found.</p>`;

    return;
  }

  let html = `

    <table>

      <thead>

        <tr>

          <th>LO</th>
          <th>Question</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody>
  `;

  existingLOs.forEach(lo => {

    html += `

      <tr class="${
        currentEditingLO===lo.LO_ID
        ? 'selected-row'
        : ''
      }">

        <td>
          ${escapeHtml(lo.LO_ID)}
        </td>

        <td>
          ${escapeHtml(lo.LO_Question)}
        </td>

        <td>

          <button class="small-button"
                  onclick="loadLOIntoForm('${escapeJs(lo.LO_ID)}')">

            Edit Existing LO

          </button>

          <button class="small-button"
                  onclick="viewLODetails('${escapeJs(lo.LO_ID)}')">

            View LO Details

          </button>

        </td>

      </tr>
    `;
  });

  html += `
      </tbody>
    </table>
  `;

  box.innerHTML = html;
}

/************************************
 * LOAD LO INTO FORM
 ************************************/
async function loadLOIntoForm(loId){

  currentEditingLO = loId;

  renderExistingLOs();

  const res =
    await fetch(
      `${BASE_URL}?action=getLOPackage&loId=${encodeURIComponent(loId)}`
    );

  const data =
    await res.json();

  const lo =
    existingLOs.find(x => x.LO_ID===loId);

  document
    .getElementById("editingLabel")
    .innerHTML =
      `Editing ${escapeHtml(loId)}`;

  const loNumber =
    loId.split("_LO")[1] || "";

  document
    .getElementById("loNumber")
    .value = loNumber;

  document
    .getElementById("loQuestion")
    .value =
      lo.LO_Question || "";

  /***** BULLETS *****/
  document
    .getElementById("answerBullets")
    .value =
      (data.answerBullets || [])
        .map(x => x.Canonical_Answer)
        .join("\n");

  /***** HINTS *****/
  document
    .getElementById("hints")
    .value =
      (data.answerBullets || [])
        .map(x => x.Hint || "")
        .join("\n");

  /***** KEYWORDS *****/
  renderKeywordRows(data);

  /***** BLANKS *****/
  document
    .getElementById("blankTemplates")
    .value =
      (data.blankTemplates || [])
        .map(x =>
          `${x.Bullet_Order} | ${x.Teacher_Final_Blank} | ${x.Blank_Targets}`
        )
        .join("\n");

  /***** COMMON QUESTIONS *****/
  document
    .getElementById("commonQuestions")
    .value =
      (data.commonQuestions || [])
        .map(x => x.Common_Question)
        .join("\n");
}

/************************************
 * RENDER KEYWORDS
 ************************************/
function renderKeywordRows(data){

  const body =
    document
      .getElementById("keywordBody");

  body.innerHTML = "";

  (data.keywords || []).forEach(k => {

    const variants =
      (data.variants || [])

        .filter(v =>
          v.Keyword_ID===k.Keyword_ID
        )

        .map(v =>
          v.Accepted_Variant
        )

        .join("; ");

    const unacceptable =
      (data.unacceptable || [])

        .map(u => u.Phrase)

        .join("; ");

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td class="bullet-col">
        <input value="${escapeHtml(k.Bullet_Order)}">
      </td>

      <td>
        <input value="${escapeHtml(k.Keyword_or_Phrase)}">
      </td>

      <td>
        <textarea>${escapeHtml(variants)}</textarea>
      </td>

      <td>
        <textarea>${escapeHtml(unacceptable)}</textarea>
      </td>
    `;

    body.appendChild(row);
  });
}

/************************************
 * VIEW DETAILS
 ************************************/
async function viewLODetails(loId){

  await loadLOIntoForm(loId);

  alert(
    "LO details loaded into the form below."
  );
}

/************************************
 * SAVE NEW
 ************************************/
function saveNewLO(){

  submitLOAction(
    "saveLOPackage"
  );
}

/************************************
 * UPDATE EXISTING
 ************************************/
function updateExistingLO(){

  if(!currentEditingLO){

    showError(
      "Please choose an existing LO first."
    );

    return;
  }

  submitLOAction(
    "updateLOPackage"
  );
}

/************************************
 * SUBMIT
 ************************************/
function submitLOAction(action){

  clearStatus();

  try{

    const payload =
      buildPayload();

    const form =
      document.createElement("form");

    form.method = "POST";
    form.action = BASE_URL;
    form.target = "hiddenSaveFrame";
    form.style.display = "none";

    const actionInput =
      document.createElement("input");

    actionInput.name = "action";
    actionInput.value = action;

    const payloadInput =
      document.createElement("input");

    payloadInput.name = "payload";
    payloadInput.value =
      JSON.stringify(payload);

    form.appendChild(actionInput);
    form.appendChild(payloadInput);

    document.body.appendChild(form);

    form.submit();

    if(action==="saveLOPackage"){

      showSuccess(
        `Saved ${payload.loId}`
      );

    }else{

      showSuccess(
        `Updated ${payload.loId}`
      );
    }

    setTimeout(() => {

      form.remove();

      loadExistingLOs();

    },3000);

  }catch(err){

    showError(
      err.message
    );
  }
}

/************************************
 * BUILD PAYLOAD
 ************************************/
function buildPayload(){

  const topicId =
    val("topicId");

  const topicCode =
    val("topicCode");

  const loNumber =
    val("loNumber");

  const loQuestion =
    val("loQuestion");

  const loId =
    `${topicCode}_LO${loNumber}`;

  const hintLines =
    lines("hints");

  const answerBullets =
    lines("answerBullets")

      .map((line,i)=>({

        bulletOrder:i+1,

        canonicalAnswer:line,

        hint:
          hintLines[i] || ""
      }));

  const keywords =
    readKeywordTable();

  const blankTemplates =
    lines("blankTemplates")

      .map(line=>{

        const parts =
          splitPipe(line);

        return {

          bulletOrder:
            parts[0] || "",

          template:
            parts[1] || "",

          targets:
            parts[2] || ""
        };
      });

  const commonQuestions =
    lines("commonQuestions");

  return {

    topicId,

    loId,

    loOrder:loNumber,

    loQuestion,

    answerBullets,

    keywords,

    blankTemplates,

    commonQuestions
  };
}

/************************************
 * PREVIEW
 ************************************/
function previewRows(){

  const payload =
    buildPayload();

  document
    .getElementById("output")
    .style.display = "block";

  document
    .getElementById("previewPayload")
    .innerText =
      JSON.stringify(
        payload,
        null,
        2
      );
}

/************************************
 * RESET
 ************************************/
function resetForm(){

  currentEditingLO = null;

  renderExistingLOs();

  document
    .getElementById("editingLabel")
    .innerHTML =
      "Creating NEW LO";

  document
    .getElementById("loNumber")
    .value = "";

  document
    .getElementById("loQuestion")
    .value = "";

  document
    .getElementById("answerBullets")
    .value = "";

  document
    .getElementById("hints")
    .value = "";

  document
    .getElementById("blankTemplates")
    .value = "";

  document
    .getElementById("commonQuestions")
    .value = "";

  document
    .getElementById("keywordBody")
    .innerHTML = "";
}

/************************************
 * KEYWORD ROW
 ************************************/
function addKeywordRow(){

  const tbody =
    document
      .getElementById("keywordBody");

  const row =
    document.createElement("tr");

  row.innerHTML = `

    <td class="bullet-col">
      <input>
    </td>

    <td>
      <input>
    </td>

    <td>
      <textarea></textarea>
    </td>

    <td>
      <textarea></textarea>
    </td>
  `;

  tbody.appendChild(row);
}

/************************************
 * READ KEYWORDS
 ************************************/
function readKeywordTable(){

  const rows =
    document.querySelectorAll(
      "#keywordBody tr"
    );

  const output = [];

  rows.forEach(row => {

    const inputs =
      row.querySelectorAll("input");

    const textareas =
      row.querySelectorAll("textarea");

    const bulletNo =
      inputs[0]
        .value
        .trim();

    const keyword =
      inputs[1]
        .value
        .trim();

    const variants =
      splitSemicolon(
        textareas[0].value
      );

    const unacceptable =
      splitSemicolon(
        textareas[1].value
      );

    if(bulletNo && keyword){

      output.push({

        bulletNo,

        keyword,

        variants,

        unacceptable
      });
    }
  });

  return output;
}

/************************************
 * STATUS
 ************************************/
function clearStatus(){

  document
    .getElementById("status")
    .innerHTML = "";
}

function showSuccess(msg){

  document
    .getElementById("status")
    .innerHTML = `

      <div class="success">
        ${escapeHtml(msg)}
      </div>
    `;
}

function showError(msg){

  document
    .getElementById("status")
    .innerHTML = `

      <div class="error">
        ${escapeHtml(msg)}
      </div>
    `;
}

/************************************
 * HELPERS
 ************************************/
function val(id){

  return document
    .getElementById(id)
    .value
    .trim();
}

function lines(id){

  return document
    .getElementById(id)
    .value

    .split("\n")

    .map(x=>x.trim())

    .filter(Boolean);
}

function splitPipe(line){

  return line
    .split("|")
    .map(x=>x.trim());
}

function splitSemicolon(text){

  return String(text || "")

    .split(";")

    .map(x=>x.trim())

    .filter(Boolean);
}

function escapeHtml(text){

  return String(text || "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeJs(text){

  return String(text || "")

    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
</script>

<iframe name="hiddenSaveFrame"
        style="display:none;"></iframe>

</body>
</html>
